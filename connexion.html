<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="img/LOGO-CFS-300x110px.png" alt="">
    </header>
    <fieldset>
        <legend>Inscription</legend>
        <form action="">
            <fieldset>
                <legend>Infortions de connexion</legend>
                <table>
                    <tr>
                        <td><label for="">Adresse électronique :</label></td>
                        <td><input type="email"></td>
                    </tr>
                    <tr>
                        <td><label for="">Mot de passe :</label></label></td>
                        <td><input type="password"></td>
                    </tr>
                    <tr>
                        <td><label for="">Entrez a nouveau le mot de passe :</label></td>
                        <td><input type="password"></td>
                    </tr>
                </table>
            </fieldset>
            <br><br>
            <fieldset>
            <legend>Infortions personnelles</legend>
            <table>
                <tr>
                    <td><label for="">Prenom :</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">Nom :</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">Genre :</label></td>
                    <td>
                        <input type="radio" name="sexe"><label for="">M</label><br>
                        <input type="radio" name="sexe"><label for="">F</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="">Civlité :</label></td>
                    <td>
                        <select name="" id="">
                            <option value="">M.</option>
                            <option value="">Mlle.</option>
                            <option value="">Mme</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="">Adresse :</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">Ville :</label></td>
                    <td>
                        <input type="text">
                        <label for="">Code Postal</label>
                        <input type="number">
                    </td>
                </tr>
            </table>
            </fieldset>
            <br><br>
            <fieldset>
                <legend>Infortions de carte credit</legend>
                <table>
                    <tr>
                        <td><label for="">Type de carte : </label></td>
                        <td>
                            <input type="radio" name="typeDeCarte"><label for="">MasterCard</label><br>
                            <input type="radio" name="typeDeCarte"><label for="">Visa</label>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="">Numéros de carte :</label></td>
                        <td><input type="number" name="" id=""></td>
                    </tr>
                    <tr>
                        <td><label for="">Date d'expiration :</label></td>
                        <td><input type="date" name="" id=""></td>
                    </tr>
                </table><br>
                    <input type="submit" value="Connexion">

            </fieldset>
        </form>
    </fieldset>
</body>
</html>
